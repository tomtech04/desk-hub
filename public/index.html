<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Desk Hub</title>
  <meta name="theme-color" content="#0c0e11">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desk Hub">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <nav class="rail" id="rail"></nav>
  <main id="view"></main>
  <div id="banner"></div>
  <div id="toasts"></div>
  <div id="drawer" class="drawer" hidden></div>
  <div id="focuslock" class="focuslock" hidden></div>
  <div id="keyboard" class="kb" hidden></div>
  <div id="sleep" class="sleep" hidden></div>
  <div id="morning" class="morning" data-act="morning-done" hidden></div>
  <div id="login" class="login" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
