<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Desk Hub</title>
  <meta name="theme-color" content="#0C0E12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desk Hub">
  <link rel="preload" href="fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="graphite.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="g-focus" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC65C"/><stop offset="1" stop-color="#FF7A45"/></linearGradient>
    <linearGradient id="g-cal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8AB4FF"/><stop offset="1" stop-color="#8C7BFF"/></linearGradient>
    <linearGradient id="g-money" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6EF0B4"/><stop offset="1" stop-color="#1FB5C9"/></linearGradient>
  </defs></svg>
  <header id="status"></header>
  <nav class="rail" id="rail"></nav>
  <main id="view"></main>
  <div id="banner"></div>
  <div id="toasts"></div>
  <div id="ringnote" class="ringnote" data-act="ring-open" hidden></div>
  <div id="drawer" class="drawer" hidden></div>
  <div id="focuslock" class="focuslock" hidden></div>
  <div id="keyboard" class="kb" hidden></div>
  <div id="sleep" class="sleep" hidden></div>
  <div id="morning" class="morning" data-act="morning-done" hidden></div>
  <div id="login" class="login" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
