# XcodeGen spec for the iPhone app. Run `bash ios/setup.sh` rather than xcodegen directly:
# it builds RingKit first, which the project links.
name: DeskHub
options:
  bundleIdPrefix: com.deskhub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.4

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  DeskHub:
    type: application
    platform: iOS
    sources:
      - path: DeskHub
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - package: FluidAudio
      - framework: RingKit/build/XCFrameworks/release/RingKit.xcframework
        embed: true
    # HealthKit, and iOS waking the app when the watch syncs new heart data.
    entitlements:
      path: DeskHub/DeskHub.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: DeskHub/Info.plist
      properties:
        CFBundleDisplayName: Desk Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        # Lets iOS wake the app when the ring has a recording, the way it woke the Pebble app.
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: Desk Hub connects to your Index 01 ring to collect its voice notes.
        NSLocalNetworkUsageDescription: Desk Hub connects to your hub on your home network.
        NSMicrophoneUsageDescription: Desk Hub records journal notes you speak. They're transcribed on this iPhone; only the text goes to your hub.
        NSHealthShareUsageDescription: Desk Hub reads your heart rate, HRV, activity and workouts to estimate how your day is going. Only the day's totals go to your hub.
        NSHealthUpdateUsageDescription: Desk Hub saves your check-ins to Health as State of Mind.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DESKHUB_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The ring library ships no Intel simulator slice; the simulator needs an Apple silicon Mac.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

schemes:
  DeskHub:
    build:
      targets:
        DeskHub: all
    run:
      config: Debug
    archive:
      config: Release
