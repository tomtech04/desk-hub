# Builds the iPhone app on a Mac in the cloud whenever ios/ changes. The result is an unsigned
# .ipa (under the run's Artifacts) that Sideloadly or AltStore can sign with your Apple ID.
name: iPhone app

on:
  push:
    paths:
      - 'ios/**'
      - '!ios/**/*.md'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ringkit-${{ runner.os }}-${{ hashFiles('ios/RingKit/*.kts', 'ios/RingKit/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build RingKit and generate the Xcode project
        run: |
          brew install xcodegen
          bash ios/setup.sh

      - name: Build the app (unsigned)
        run: |
          mkdir -p build
          xcodebuild -project ios/DeskHub.xcodeproj -scheme DeskHub -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build | tee build/xcodebuild.log | grep -E "error|warning: .*deprecated|BUILD" || true
          test -d build/dd/Build/Products/Release-iphoneos/DeskHub.app

      - name: Package the unsigned .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/DeskHub.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../DeskHub-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: DeskHub-unsigned-ipa
          path: build/DeskHub-unsigned.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
