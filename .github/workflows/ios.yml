# Builds the iPhone app on a Mac in the cloud whenever ios/ changes, runs it in an iPhone
# simulator against the hub's demo data, and keeps a screenshot of every screen (under the run's
# Artifacts). On main it also keeps an unsigned .ipa that Sideloadly or AltStore can sign with
# your Apple ID.
name: iPhone app

on:
  push:
    paths:
      - 'ios/**'
      - '!ios/**/*.md'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ringkit-${{ runner.os }}-${{ hashFiles('ios/RingKit/*.kts', 'ios/RingKit/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build RingKit and generate the Xcode project
        run: |
          brew install xcodegen
          bash ios/setup.sh

      - name: Start the hub with demo data
        run: |
          npm ci --no-audit --no-fund
          DEMO=1 PORT=8080 nohup node server/index.js > hub.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/api/dashboard > /dev/null && break; sleep 1; done
          curl -s -X POST localhost:8080/api/digest
          curl -s -X POST localhost:8080/api/recap
          curl -s -X POST localhost:8080/api/voice -H 'Content-Type: application/json' -H 'x-hub-source: phone' \
            -d '{"text":"Remind me to call the bank tomorrow about the payout hold. Today felt productive, I finished the dynamics problem set."}'
          curl -s -X POST localhost:8080/api/journal/daynote -H 'Content-Type: application/json' -d '{"text":"Coffee with Sam went well; talk again next week."}'

      - name: Build for the simulator
        run: |
          mkdir -p build
          xcodebuild -project ios/DeskHub.xcodeproj -scheme DeskHub -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build > build/xcodebuild-sim.log 2>&1 || true
          grep -E "error:|\*\* BUILD" build/xcodebuild-sim.log | sort -u | head -60
          test -d build/sim/Build/Products/Debug-iphonesimulator/DeskHub.app

      - name: Run it in the simulator and take screenshots
        run: bash ios/scripts/screenshots.sh build/sim/Build/Products/Debug-iphonesimulator/DeskHub.app build/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: build/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: simulator-logs
          path: |
            build/xcodebuild-sim.log
            hub.log
          if-no-files-found: ignore

  device:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ringkit-${{ runner.os }}-${{ hashFiles('ios/RingKit/*.kts', 'ios/RingKit/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build RingKit and generate the Xcode project
        run: |
          brew install xcodegen
          bash ios/setup.sh

      - name: Build the app (unsigned)
        run: |
          mkdir -p build
          xcodebuild -project ios/DeskHub.xcodeproj -scheme DeskHub -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build > build/xcodebuild.log 2>&1 || true
          grep -E "error:|\*\* BUILD" build/xcodebuild.log | sort -u | head -60
          test -d build/dd/Build/Products/Release-iphoneos/DeskHub.app

      - name: Package the unsigned .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/DeskHub.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../DeskHub-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: DeskHub-unsigned-ipa
          path: build/DeskHub-unsigned.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
